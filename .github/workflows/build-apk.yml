name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          set -e
          if [ ! -f www/index.html ]; then
            for z in *.zip; do
              [ -e "$z" ] || continue
              unzip -o -q "$z"
            done
            hit=$(find . -maxdepth 4 -type f -path "*/www/index.html" | head -1)
            [ -n "$hit" ] && cp -r "$(dirname "$(dirname "$hit")")"/. .
          fi
          test -f www/index.html || { echo "www/index.html not found"; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Native code and resources
        run: |
          set -e
          D=android/app/src/main/java/com/zenfocus/app
          RES=android/app/src/main/res
          mkdir -p "$D" "$RES"
          cp native/*.java "$D/"
          cp -r native/res/. "$RES/"
          python3 native/manifest_patch.py

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ZenFocus-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
