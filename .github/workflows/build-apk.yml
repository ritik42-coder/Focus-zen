name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          set -e
          if [ ! -f www/index.html ]; then
            for z in *.zip; do
              [ -e "$z" ] || continue
              unzip -o -q "$z"
            done
            hit=$(find . -maxdepth 4 -type f -path "*/www/index.html" | head -1)
            [ -n "$hit" ] && cp -r "$(dirname "$(dirname "$hit")")"/. .
          fi
          test -f www/index.html || { echo "www/index.html not found"; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Native code, icons and permissions
        run: |
          set -e
          D=android/app/src/main/java/com/zenfocus/app
          RES=android/app/src/main/res
          mkdir -p "$D"
          cp native/UsagePlugin.java native/BlockService.java native/MainActivity.java "$D/"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            cp native/res/mipmap-$d/*.png "$RES/mipmap-$d/"
          done
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = (
              '<uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY"/>\n'
              '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    '
          )
          if 'PACKAGE_USAGE_STATS' not in s:
              s = s.replace('<application', perms + '<application', 1)
          service = (
              '<service android:name=".BlockService" android:exported="false" '
              'android:foregroundServiceType="specialUse">\n'
              '            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" '
              'android:value="Screen time limit enforcement"/>\n'
              '        </service>\n    '
          )
          if 'BlockService' not in s:
              s = s.replace('</application>', service + '</application>', 1)
          open(p, 'w').write(s)
          print('manifest patched')
          PY

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ZenFocus-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
